# Coolify — Evidens
# Frontend: https://evidens.ba101.top (domena/SSL/port se podešava u Coolify UI po servisu,
#   container sluša na 3000; može se promijeniti na 80 u Coolify UI ako je poželjno).
# Backend:  https://api.evidens.ba101.top (posebna subdomena, BEZ path-prefiksa — otud
#   API_PREFIX prazan u env-u; vidi napomenu kod API_PREFIX ispod).
# Baza: eksterni Postgres projekat na "db_net" mreži, host je container/service ime
#   Postgres resursa u Coolify-ju (vidi docs/coolify-env.md).
# Redis: eksterna centralna Redis platforma na "redis_net" mreži (redis-core service,
#   ACL user ograničen na REDIS_KEY_PREFIX namespace). Koristi se za: JWT/settings
#   cache, BullMQ (inventory session close queue, document generation queue), Socket.IO
#   horizontalno skaliranje, distribuirani lock za dnevni scheduler, i rate limiting
#   na /auth/login. Vidi backend/src/redis/ i backend/src/queues/ za implementaciju.
# Document Worker: zaseban interni servis (LibreOffice) za DOCX/XLSX/ODT -> PDF
#   konverziju, konzumira BullMQ `document-generation` red preko iste redis_net
#   mreže/ACL usera kao backend. NEMA "expose" i NEMA domenu u Coolify-ju — čisto
#   interni BullMQ konzument, bez javne mrežne izloženosti. Vidi document-worker/.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - APP_NAME=${APP_NAME:-evidens}
      - APP_DISPLAY_NAME=${APP_DISPLAY_NAME:-Evidens}
      - APP_SUBTITLE=${APP_SUBTITLE:-Hijerarhijska evidencija i zaduženje opreme}
      - APP_URL=${APP_URL}
      # VAŽNO: koristi se "${API_PREFIX-backend}" (bez dvotačke), ne "${API_PREFIX:-backend}".
      # Sa dvotačkom, Docker Compose (bash pravilo) vraća default "backend" i kad je
      # API_PREFIX eksplicitno postavljen na PRAZAN string, što je tačno slučaj kad
      # backend radi na svojoj subdomeni (api.evidens.ba101.top) bez path-prefiksa.
      # Bez dvotačke se prazan string ispoštuje, a default se koristi samo ako
      # varijabla uopšte nije definisana u Coolify env-u.
      - API_PREFIX=${API_PREFIX-backend}
      - DB_PROVIDER=${DB_PROVIDER:-postgresql}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_SSL_MODE=${DATABASE_SSL_MODE:-verify-full}
      - DATABASE_SSL_CA=${DATABASE_SSL_CA:-/etc/ssl/certs/coolify-ca.crt}
      # Replike × ovaj broj + worker/migracije/maintenance < max_connections.
      - DATABASE_POOL_MAX=${DATABASE_POOL_MAX:-10}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-7d}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
      - HSTS_MAX_AGE_SECONDS=${HSTS_MAX_AGE_SECONDS:-15552000}
      - GLOBAL_RATE_LIMIT_ENABLED=${GLOBAL_RATE_LIMIT_ENABLED:-false}
      - GLOBAL_RATE_LIMIT_MAX=${GLOBAL_RATE_LIMIT_MAX:-300}
      - GLOBAL_RATE_LIMIT_WINDOW_SEC=${GLOBAL_RATE_LIMIT_WINDOW_SEC:-60}
      - GLOBAL_RATE_LIMIT_FAIL_CLOSED=${GLOBAL_RATE_LIMIT_FAIL_CLOSED:-false}
      - BACKEND_PORT=${BACKEND_PORT:-3000}
      - INVENTORY_SCHEDULER_ENABLED=${INVENTORY_SCHEDULER_ENABLED:-false}
      # --- Redis (centralna platforma, vidi redis-platform repo) ---
      - REDIS_HOST=${REDIS_HOST:-redis-core}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-inventory-v2}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-inventory-v2}
      - REDIS_TLS=${REDIS_TLS:-false}
      - REDIS_CA_CERT_PATH=${REDIS_CA_CERT_PATH:-/run/secrets/redis-ca.crt}
      # true = fail closed when the shared Socket.IO Redis adapter is missing.
      - SOCKETIO_REQUIRE_SHARED_ADAPTER=${SOCKETIO_REQUIRE_SHARED_ADAPTER:-false}
      - RATE_LIMIT_LOGIN_MAX=${RATE_LIMIT_LOGIN_MAX:-10}
      - RATE_LIMIT_LOGIN_WINDOW_SEC=${RATE_LIMIT_LOGIN_WINDOW_SEC:-60}
      - RATE_LIMIT_LOGIN_FAIL_CLOSED=${RATE_LIMIT_LOGIN_FAIL_CLOSED:-false}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - RATE_LIMIT_AUTH_SESSION_MAX=${RATE_LIMIT_AUTH_SESSION_MAX:-120}
      - RATE_LIMIT_AUTH_SESSION_WINDOW_SEC=${RATE_LIMIT_AUTH_SESSION_WINDOW_SEC:-60}
      - RATE_LIMIT_AUTH_SESSION_FAIL_CLOSED=${RATE_LIMIT_AUTH_SESSION_FAIL_CLOSED:-false}
      - RATE_LIMIT_PUBLIC_EQUIPMENT_MAX=${RATE_LIMIT_PUBLIC_EQUIPMENT_MAX:-60}
      - RATE_LIMIT_PUBLIC_EQUIPMENT_WINDOW_SEC=${RATE_LIMIT_PUBLIC_EQUIPMENT_WINDOW_SEC:-60}
      - RATE_LIMIT_PUBLIC_EQUIPMENT_FAIL_CLOSED=${RATE_LIMIT_PUBLIC_EQUIPMENT_FAIL_CLOSED:-false}
      - PUBLIC_EQUIPMENT_MAX_MOVEMENTS=${PUBLIC_EQUIPMENT_MAX_MOVEMENTS:-200}
      - TRANSFER_RAW_DOCUMENT_DISPOSITION=${TRANSFER_RAW_DOCUMENT_DISPOSITION:-attachment}
      - DOCUMENT_JOB_STALE_TIMEOUT_MS=${DOCUMENT_JOB_STALE_TIMEOUT_MS:-1800000}
    volumes:
      - /mnt/shared-app-files/inventory-v2:/app/uploads
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
      - /data/coolify/ssl/redis-core/redis-ca.crt:/run/secrets/redis-ca.crt:ro
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'const http=require("node:http"); const raw=process.env.API_PREFIX;
          const prefix=(raw===undefined?"backend":raw).trim().replace(/^\/+|\/+$/g,"");
          const path=(prefix?"/"+prefix:"")+"/health/ready";
          http.get({host:"127.0.0.1",port:3000,path},r=>process.exit(r.statusCode===200?0:1))
          .on("error",()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    networks:
      - db_net
      - redis_net

  document-worker:
    build:
      context: ./document-worker
      dockerfile: Dockerfile
    environment:
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      # --- Redis (ISTA platforma/ACL user kao backend — vidi napomenu na vrhu) ---
      - REDIS_HOST=${REDIS_HOST:-redis-core}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-inventory-v2}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-inventory-v2}
      - REDIS_TLS=${REDIS_TLS:-false}
      - REDIS_CA_CERT_PATH=${REDIS_CA_CERT_PATH:-/run/secrets/redis-ca.crt}
      - DOCUMENT_QUEUE_NAME=${DOCUMENT_QUEUE_NAME:-document-generation}
      - DOCUMENT_WORKER_CONCURRENCY=${DOCUMENT_WORKER_CONCURRENCY:-2}
      - DOCUMENT_WORKER_CONVERT_TIMEOUT_MS=${DOCUMENT_WORKER_CONVERT_TIMEOUT_MS:-120000}
      - DOCUMENT_WORKER_HEALTH_PORT=8080
    volumes:
      # ISTI host direktorij kao backend — worker čita DOCX/XLSX/ODT koje je
      # backend upisao i piše PDF nazad na isti volume, kao "generated" izlaz.
      - /mnt/shared-app-files/inventory-v2:/app/uploads
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
      - /data/coolify/ssl/redis-core/redis-ca.crt:/run/secrets/redis-ca.crt:ro
    restart: unless-stopped
    # NEMA "expose" — nema HTTP API, samo interni Redis/BullMQ konzument.
    # NEMA "ports" — nikad ne treba biti dostupan van kontejnerske mreže.
    networks:
      - redis_net
    # Resource limiti — LibreOffice je memorijski zahtjevan; ograničava
    # "blast radius" jednog zaglavljenog/teškog konverzionog posla.
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    # Sigurnosna ograničenja: read-only root fs (LibreOffice piše samo u
    # izolovane per-job profile pod /tmp preko tmpfs-a i u UPLOAD_DIR volume),
    # bez novih privilegija, bez Linux capability-ja (headless konverzija ih
    # ne treba).
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Graceful shutdown čeka da se AKTIVNI soffice poziv završi (do
    # DOCUMENT_WORKER_CONVERT_TIMEOUT_MS) prije nego container primi SIGKILL
    # — mora biti veći od najdužeg očekivanog poziva.
    stop_grace_period: 150s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8080/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_URL: ${VITE_APP_URL}
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
networks:
  db_net:
    external: true
    name: db_net
  redis_net:
    external: true
    name: redis_net
