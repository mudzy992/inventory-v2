name: Branch CI

on:
  push:
    branches:
      - arena/60c1635e-inventory-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend checks (PostgreSQL + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventory_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_ci?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NODE_ENV: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Validate Prisma schema and migrations
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Verify SQL-only migration invariant
        working-directory: backend
        run: npm run test:integration:migrations

      - name: Verify temporary Redis service
        working-directory: backend
        run: |
          node <<'NODE'
          const Redis = require('ioredis');
          const redis = new Redis({ host: process.env.REDIS_HOST, port: Number(process.env.REDIS_PORT) });
          (async () => {
            try {
              const response = await redis.ping();
              if (response !== 'PONG') throw new Error(`Unexpected Redis PING response: ${response}`);
              console.log('Redis PING:', response);
            } finally {
              await redis.quit();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify atomic Redis rate-limit integration
        working-directory: backend
        run: npm run test:integration:redis-rate-limit

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Typecheck backend
        working-directory: backend
        run: |
          set +e
          npx tsc --noEmit --pretty false > "$RUNNER_TEMP/backend-tsc.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/backend-tsc.log"
          if [ "$status" -ne 0 ]; then
            node <<'NODE'
          const fs = require('node:fs');
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/backend-tsc.log`, 'utf8');
          for (const diagnostic of log.split(/\r?\n/)) {
            const match = diagnostic.match(/^(.+)\((\d+),(\d+)\): error (TS\d+): (.*)$/);
            if (match) {
              const [, file, line, column, code, message] = match;
              console.log(`::error file=backend/${file},line=${line},col=${column},title=${code}::${message}`);
            }
          }
          NODE
            {
              echo '### Backend TypeScript diagnostics'
              echo '```text'
              cat "$RUNNER_TEMP/backend-tsc.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Run backend unit specs
        working-directory: backend
        run: npm run test:unit

      - name: Run frontend guard specs
        working-directory: backend
        run: npm run test:smoke:guards-fe

      - name: Build backend
        working-directory: backend
        run: npx nest build

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=low

  document-worker:
    name: Document worker checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: document-worker/package-lock.json

      - name: Install document worker dependencies
        working-directory: document-worker
        run: npm ci

      - name: Run document worker unit specs
        working-directory: document-worker
        run: npm run test:unit

      - name: Build document worker
        working-directory: document-worker
        run: npm run build

      - name: Audit document worker dependencies
        working-directory: document-worker
        run: npm audit --audit-level=low

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=low
