# Coolify — Evidens
# Frontend: https://evidens.ba101.top (domena/SSL/port se podešava u Coolify UI po servisu,
#   container sluša na 3000; može se promijeniti na 80 u Coolify UI ako je poželjno).
# Backend:  https://api.evidens.ba101.top (posebna subdomena, BEZ path-prefiksa — otud
#   API_PREFIX prazan u env-u; vidi napomenu kod API_PREFIX ispod).
# Baza: eksterni Postgres projekat na "db_net" mreži, host je container/service ime
#   Postgres resursa u Coolify-ju (vidi DATABASE_HOST u fajl.txt).
# Redis: eksterna centralna Redis platforma na "redis_net" mreži (redis-core service,
#   ACL user ograničen na REDIS_KEY_PREFIX namespace). Koristi se za: JWT/settings
#   cache, BullMQ (inventory session close queue), Socket.IO horizontalno skaliranje,
#   distribuirani lock za dnevni scheduler, i rate limiting na /auth/login.
#   Vidi backend/src/redis/ i backend/src/queues/ za implementaciju.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - APP_NAME=${APP_NAME:-evidens}
      - APP_DISPLAY_NAME=${APP_DISPLAY_NAME:-Evidens}
      - APP_SUBTITLE=${APP_SUBTITLE:-Hijerarhijska evidencija i zaduženje opreme}
      - APP_URL=${APP_URL}
      # VAŽNO: koristi se "${API_PREFIX-backend}" (bez dvotačke), ne "${API_PREFIX:-backend}".
      # Sa dvotačkom, Docker Compose (bash pravilo) vraća default "backend" i kad je
      # API_PREFIX eksplicitno postavljen na PRAZAN string, što je tačno slučaj kad
      # backend radi na svojoj subdomeni (api.evidens.ba101.top) bez path-prefiksa.
      # Bez dvotačke se prazan string ispoštuje, a default se koristi samo ako
      # varijabla uopšte nije definisana u Coolify env-u.
      - API_PREFIX=${API_PREFIX-backend}
      - DB_PROVIDER=${DB_PROVIDER:-postgresql}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_URL=${DATABASE_URL}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-7d}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - BACKEND_PORT=${BACKEND_PORT:-3000}
      - INVENTORY_SCHEDULER_ENABLED=${INVENTORY_SCHEDULER_ENABLED:-false}
      # --- Redis (centralna platforma, vidi redis-platform repo) ---
      - REDIS_HOST=${REDIS_HOST:-redis-core}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-inventory-v2}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-inventory-v2}
      - REDIS_TLS=${REDIS_TLS:-false}
      - RATE_LIMIT_LOGIN_MAX=${RATE_LIMIT_LOGIN_MAX:-10}
      - RATE_LIMIT_LOGIN_WINDOW_SEC=${RATE_LIMIT_LOGIN_WINDOW_SEC:-60}
    volumes:
      - /mnt/shared-app-files/inventory-v2:/app/uploads
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - db_net
      - redis_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_URL: ${VITE_APP_URL}
    restart: unless-stopped
    expose:
      - "3000"
networks:
  db_net:
    external: true
    name: db_net
  redis_net:
    external: true
    name: redis_net