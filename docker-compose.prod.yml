# Produkcija — Traefik (mreža web), TLS le, host evidens.ba101.top
# Prije build/up: root .env sa DATABASE_URL, JWT_SECRET, UPLOAD_DIR=/app/uploads,
#   REDIS_PASSWORD (vidi backend/.env.example za pun spisak Redis varijabli)
# Host upload: mkdir -p /mnt/shared-app-files/inventory-v2 && ./scripts/fix-upload-permissions.sh
# Build: ./scripts/docker-prod-build.sh  (build + uklanjanje dangling image-a)
#
# Redis: ovaj (standalone, non-Coolify) deployment put NE oslanja se na
# eksternu "redis_net" konvenciju (to je Coolify-specifično — vidi
# docker-compose.yml). Umjesto toga, ovdje se pokreće SOPSTVENI Redis
# kontejner na "internal" mreži, dovoljan za single-server standalone setup.
# Document Worker: zaseban interni servis (LibreOffice) za DOCX/XLSX/ODT ->
# PDF konverziju (BullMQ `document-generation` red), na "internal" mreži,
# bez Traefik labela — nikad javno dostupan. Vidi document-worker/.
services:
  redis:
    image: redis:7.4-alpine
    container_name: evidens-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: inventory-v2-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Ovaj standalone Redis nema ACL (samo requirepass) — default user.
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: inventory-v2
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_CA_CERT_PATH: ${REDIS_CA_CERT_PATH:-}
      # Sa više backend replika postaviti true (fail-closed shared adapter).
      SOCKETIO_REQUIRE_SHARED_ADAPTER: ${SOCKETIO_REQUIRE_SHARED_ADAPTER:-false}
      RATE_LIMIT_PUBLIC_EQUIPMENT_MAX: ${RATE_LIMIT_PUBLIC_EQUIPMENT_MAX:-60}
      RATE_LIMIT_PUBLIC_EQUIPMENT_WINDOW_SEC: ${RATE_LIMIT_PUBLIC_EQUIPMENT_WINDOW_SEC:-60}
      RATE_LIMIT_PUBLIC_EQUIPMENT_FAIL_CLOSED: ${RATE_LIMIT_PUBLIC_EQUIPMENT_FAIL_CLOSED:-false}
      PUBLIC_EQUIPMENT_MAX_MOVEMENTS: ${PUBLIC_EQUIPMENT_MAX_MOVEMENTS:-200}
      # Replike × ovaj broj + worker/migracije/maintenance < max_connections.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # Eksterna PostgreSQL baza: TLS mod je eksplicitan i ne smije se
      # razlikovati od `sslmode` u DATABASE_URL. Sa privatnim CA postaviti
      # DATABASE_SSL_CA na read-only montirani PEM fajl (vidi volume ispod).
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-verify-full}
      DATABASE_SSL_CA: ${DATABASE_SSL_CA:-}
    # Upload root na hostu; unutra aplikacija gradi prenosnice/, templates/, ...
    volumes:
      - /mnt/shared-app-files/inventory-v2:/app/uploads
      # Za vanjski Redis sa privatnim CA: postaviti REDIS_TLS=true i
      # REDIS_CA_CERT_PATH=/run/secrets/redis-ca.crt, pa odkomentirati mount.
      # - /etc/ssl/private/redis-ca.crt:/run/secrets/redis-ca.crt:ro
      # Za PostgreSQL sa privatnim CA (DATABASE_SSL_CA), odkomentirati i ovaj:
      # - /etc/ssl/private/postgres-ca.crt:/run/secrets/postgres-ca.crt:ro
    networks:
      - web
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('node:http'); const raw=process.env.API_PREFIX;
          const prefix=(raw===undefined?'backend':raw).trim().replace(/^\/+|\/+$/g,'');
          const path=(prefix?'/'+prefix:'')+'/health/ready';
          http.get({host:'127.0.0.1',port:3000,path},r=>process.exit(r.statusCode===200?0:1))
          .on('error',()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.evidens-api.rule=Host(`evidens.ba101.top`) && PathPrefix(`/backend`)
      - traefik.http.routers.evidens-api.entrypoints=websecure
      - traefik.http.routers.evidens-api.tls=true
      - traefik.http.routers.evidens-api.tls.certresolver=le
      - traefik.http.routers.evidens-api.priority=100
      - traefik.http.services.evidens-api.loadbalancer.server.port=3000

  # Document Worker — zaseban interni servis (LibreOffice) za DOCX/XLSX/ODT ->
  # PDF konverziju. Konzumira BullMQ `document-generation` red preko istog
  # standalone Redis kontejnera kao backend (ISTI user, jer ovaj Redis nema
  # ACL — samo requirepass). NEMA "web" mrežu, NEMA Traefik labele — nikad
  # nije javno dostupan, samo na "internal" mreži zajedno sa Redis-om.
  document-worker:
    image: inventory-v2-document-worker:prod
    build:
      context: ./document-worker
      dockerfile: Dockerfile
    environment:
      UPLOAD_DIR: /app/uploads
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: inventory-v2
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_CA_CERT_PATH: ${REDIS_CA_CERT_PATH:-}
      DOCUMENT_QUEUE_NAME: document-generation
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}
      DOCUMENT_WORKER_CONVERT_TIMEOUT_MS: ${DOCUMENT_WORKER_CONVERT_TIMEOUT_MS:-120000}
      DOCUMENT_WORKER_HEALTH_PORT: "8080"
    volumes:
      - /mnt/shared-app-files/inventory-v2:/app/uploads
      # Isti privatni Redis CA kao backend (kada REDIS_TLS=true); read-only.
      # - /etc/ssl/private/redis-ca.crt:/run/secrets/redis-ca.crt:ro
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 150s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:8080/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: inventory-v2-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://evidens.ba101.top/backend
        VITE_APP_NAME: Evidens
        VITE_APP_URL: https://evidens.ba101.top
    networks:
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.evidens-web.rule=Host(`evidens.ba101.top`)
      - traefik.http.routers.evidens-web.entrypoints=websecure
      - traefik.http.routers.evidens-web.tls=true
      - traefik.http.routers.evidens-web.tls.certresolver=le
      - traefik.http.services.evidens-web.loadbalancer.server.port=3000

volumes:
  redis_data:

networks:
  web:
    external: true
  internal:
    driver: bridge
